<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dial Santiago — Radio en vivo</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;500;700&display=swap');
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #0c1016;
    color: #eee6d6;
    font-family: 'JetBrains Mono', monospace;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  .font-display { font-family: 'Space Grotesk', sans-serif; }
  header {
    border-bottom: 1px solid #1c232f;
    padding: 24px 20px 16px;
    position: sticky;
    top: 0;
    background: rgba(12,16,22,0.95);
    backdrop-filter: blur(6px);
    z-index: 20;
  }
  .wrap { max-width: 720px; margin: 0 auto; }
  .eyebrow { color: #f4a94b; display: flex; align-items: center; gap: 8px; font-size: 12px; letter-spacing: 0.25em; text-transform: uppercase; }
  h1 { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 32px; margin: 6px 0 2px; letter-spacing: -0.02em; }
  .sub { color: #7c8798; font-size: 13px; margin: 0 0 16px; }
  .searchRow { display: flex; gap: 8px; }
  .searchBox {
    flex: 1; display: flex; align-items: center; gap: 8px;
    background: #141a24; border: 1px solid #232c3a; border-radius: 10px;
    padding: 10px 12px;
  }
  .searchBox input {
    background: transparent; border: none; outline: none; color: #eee6d6;
    font-family: 'JetBrains Mono', monospace; font-size: 14px; width: 100%;
  }
  .searchBox input::placeholder { color: #4b5566; }
  .filterBtn {
    flex-shrink: 0; padding: 0 14px; border-radius: 10px; border: 1px solid #232c3a;
    background: transparent; color: #7c8798; font-family: 'JetBrains Mono', monospace;
    font-size: 12px; cursor: pointer;
  }
  .filterBtn.active { background: rgba(244,169,75,0.1); border-color: rgba(244,169,75,0.5); color: #f4a94b; }
  main { flex: 1; max-width: 720px; margin: 0 auto; width: 100%; padding: 20px; padding-bottom: 120px; }
  .stateMsg { text-align: center; padding: 80px 20px; color: #5f6b7d; font-size: 14px; }
  ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .stationBtn {
    width: 100%; text-align: left; display: flex; align-items: center; gap: 12px;
    padding: 12px 14px; border-radius: 10px; border: 1px solid #1c232f; background: #12161e;
    cursor: pointer; transition: all 0.15s;
  }
  .stationBtn:hover { border-color: #2a3341; background: #151b24; }
  .stationBtn.current { background: #1a2029; border-color: rgba(244,169,75,0.5); box-shadow: 0 0 0 1px rgba(244,169,75,0.25), 0 0 24px rgba(244,169,75,0.08); }
  .icon {
    flex-shrink: 0; width: 36px; height: 36px; border-radius: 50%;
    border: 1px solid #2a3341; color: #5f6b7d;
    display: flex; align-items: center; justify-content: center;
  }
  .icon.current { border-color: #f4a94b; color: #f4a94b; }
  .info { min-width: 0; flex: 1; }
  .info p.name { font-family: 'Space Grotesk', sans-serif; font-weight: 500; font-size: 14px; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .info p.tags { font-size: 11px; color: #5f6b7d; margin: 2px 0 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .badge { flex-shrink: 0; font-size: 10px; color: #f4a94b; text-transform: uppercase; letter-spacing: 0.05em; }

  #player {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: #10141b; border-top: 1px solid #1c232f;
    padding: 12px 16px; display: none; z-index: 30;
  }
  #player.show { display: block; }
  .playerRow { max-width: 720px; margin: 0 auto; display: flex; align-items: center; gap: 12px; }
  #playBtn {
    flex-shrink: 0; width: 44px; height: 44px; border-radius: 50%; border: none;
    background: #f4a94b; color: #0c1016; display: flex; align-items: center; justify-content: center;
    cursor: pointer; font-size: 16px;
  }
  .pInfo { min-width: 0; flex: 1; }
  .pInfo p.name { font-family: 'Space Grotesk', sans-serif; font-weight: 500; font-size: 14px; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pInfo p.status { font-size: 11px; color: #5f6b7d; margin: 2px 0 0; }
  #volume { width: 80px; accent-color: #f4a94b; }
  .spin { animation: spin 1s linear infinite; display: inline-block; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="eyebrow">📡 EN VIVO · SANTIAGO</div>
    <h1>Dial Santiago</h1>
    <p class="sub">Radio online gratis · emisoras chilenas al instante</p>
    <div class="searchRow">
      <div class="searchBox">
        <span>🔍</span>
        <input id="search" placeholder="Buscar emisora (ej: Bío-Bío, Los 40, deportes...)" />
      </div>
      <button id="filterBtn" class="filterBtn active">📍 RM</button>
    </div>
  </div>
</header>

<main>
  <div id="content">
    <div class="stateMsg"><span class="spin">⟳</span><br/><br/>Sintonizando emisoras…</div>
  </div>
</main>

<div id="player">
  <div class="playerRow">
    <button id="playBtn">▶</button>
    <div class="pInfo">
      <p class="name" id="pName">—</p>
      <p class="status" id="pStatus">—</p>
    </div>
    <span id="volIcon">🔊</span>
    <input id="volume" type="range" min="0" max="1" step="0.01" value="0.85" />
  </div>
</div>

<audio id="audio"></audio>

<script>
const FEATURED = [
  "Radio Bío-Bío", "Cooperativa", "ADN Radio", "Radio Agricultura", "Radio Concierto",
  "Radio Futuro", "Radioactiva", "Los 40 Chile", "Radio Pudahuel", "Corazón FM",
  "Radio Carolina", "Radio Imagina", "FMDOS", "Rock & Pop", "Tele13 Radio", "Radio Duna"
];
const API_HOSTS = [
  "https://de1.api.radio-browser.info",
  "https://fr1.api.radio-browser.info",
  "https://at1.api.radio-browser.info"
];

let stations = [];
let status = "loading";
let query = "";
let onlySantiago = true;
let current = null;
let playing = false;
let loadingStream = false;
let streamError = false;

const audio = document.getElementById('audio');
const content = document.getElementById('content');
const player = document.getElementById('player');
const playBtn = document.getElementById('playBtn');
const pName = document.getElementById('pName');
const pStatus = document.getElementById('pStatus');
const volume = document.getElementById('volume');
const volIcon = document.getElementById('volIcon');
const searchInput = document.getElementById('search');
const filterBtn = document.getElementById('filterBtn');

function normalize(s) {
  return (s || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
}

async function loadStations() {
  for (const host of API_HOSTS) {
    try {
      const res = await fetch(`${host}/json/stations/search?country=Chile&limit=300&hidebroken=true&order=clickcount&reverse=true`);
      if (!res.ok) continue;
      const data = await res.json();
      stations = data
        .filter(s => s.url_resolved || s.url)
        .map(s => ({
          id: s.stationuuid,
          name: (s.name || "Sin nombre").trim(),
          url: s.url_resolved || s.url,
          tags: s.tags,
          state: s.state,
          bitrate: s.bitrate,
          votes: s.votes
        }));
      status = "ok";
      render();
      return;
    } catch (e) { continue; }
  }
  status = "error";
  render();
}

function getFiltered() {
  let list = stations;
  if (onlySantiago) {
    list = list.filter(s => {
      const hay = normalize(`${s.name} ${s.state || ""} ${s.tags || ""}`);
      return hay.includes("santiago") || hay.includes("metropolitana") ||
        FEATURED.some(f => normalize(s.name).includes(normalize(f)));
    });
  }
  if (query.trim()) {
    const q = normalize(query);
    list = list.filter(s => normalize(`${s.name} ${s.tags || ""}`).includes(q));
  }
  return [...list].sort((a, b) => {
    const af = FEATURED.some(f => normalize(a.name).includes(normalize(f))) ? 1 : 0;
    const bf = FEATURED.some(f => normalize(b.name).includes(normalize(f))) ? 1 : 0;
    if (af !== bf) return bf - af;
    return (b.votes || 0) - (a.votes || 0);
  });
}

function render() {
  if (status === "loading") {
    content.innerHTML = `<div class="stateMsg"><span class="spin">⟳</span><br/><br/>Sintonizando emisoras…</div>`;
    return;
  }
  if (status === "error") {
    content.innerHTML = `<div class="stateMsg">⚠️<br/><br/>No se pudo conectar al directorio de radios.<br/>Revisa tu conexión e intenta recargar.</div>`;
    return;
  }
  const filtered = getFiltered();
  if (filtered.length === 0) {
    content.innerHTML = `<div class="stateMsg">Sin resultados. Prueba con otro nombre o quita el filtro "RM".</div>`;
    return;
  }
  const ul = document.createElement('ul');
  filtered.forEach(s => {
    const isCurrent = current && current.id === s.id;
    const li = document.createElement('li');
    const btn = document.createElement('button');
    btn.className = 'stationBtn' + (isCurrent ? ' current' : '');
    const iconText = isCurrent && playing ? (loadingStream ? '<span class="spin">⟳</span>' : '⏸') : '▶';
    btn.innerHTML = `
      <div class="icon${isCurrent ? ' current' : ''}">${iconText}</div>
      <div class="info">
        <p class="name">${s.name}</p>
        <p class="tags">${(s.tags ? s.tags.split(',').slice(0,3).join(' · ') : 'radio online')}${s.bitrate ? ' · ' + s.bitrate + 'kbps' : ''}</p>
      </div>
      ${isCurrent ? `<span class="badge">${playing ? 'al aire' : 'pausa'}</span>` : ''}
    `;
    btn.onclick = () => play(s);
    li.appendChild(btn);
    ul.appendChild(li);
  });
  content.innerHTML = '';
  content.appendChild(ul);
}

function play(station) {
  streamError = false;
  if (current && current.id === station.id) {
    togglePlay();
    return;
  }
  current = station;
  loadingStream = true;
  playing = true;
  audio.src = station.url;
  audio.play().then(() => {
    loadingStream = false;
    render();
    renderPlayer();
  }).catch(() => {
    loadingStream = false;
    streamError = true;
    playing = false;
    render();
    renderPlayer();
  });
  render();
  renderPlayer();
}

function togglePlay() {
  if (!current) return;
  if (playing) {
    audio.pause();
    playing = false;
  } else {
    audio.play().catch(() => { streamError = true; });
    playing = true;
  }
  render();
  renderPlayer();
}

function renderPlayer() {
  if (!current) { player.classList.remove('show'); return; }
  player.classList.add('show');
  pName.textContent = current.name;
  pStatus.textContent = streamError ? 'No se pudo reproducir esta señal' : (playing ? 'transmitiendo en vivo' : 'en pausa');
  playBtn.innerHTML = loadingStream ? '<span class="spin">⟳</span>' : (playing ? '⏸' : '▶');
}

playBtn.onclick = togglePlay;
searchInput.oninput = (e) => { query = e.target.value; render(); };
filterBtn.onclick = () => {
  onlySantiago = !onlySantiago;
  filterBtn.classList.toggle('active', onlySantiago);
  render();
};
volume.oninput = (e) => {
  audio.volume = parseFloat(e.target.value);
  volIcon.textContent = audio.volume === 0 ? '🔇' : '🔊';
};
audio.volume = 0.85;
audio.onwaiting = () => { loadingStream = true; renderPlayer(); };
audio.onplaying = () => { loadingStream = false; renderPlayer(); };
audio.onerror = () => { streamError = true; loadingStream = false; playing = false; render(); renderPlayer(); };

loadStations();
</script>
</body>
</html>
